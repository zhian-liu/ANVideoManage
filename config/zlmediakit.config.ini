; ZLMediaKit 精简配置（覆盖关键项，其余使用 ZLMediaKit 默认值）
; 将本文件复制到 ZLMediaKit 运行目录下的 config.ini，或通过 -c 参数指定

[api]
; REST API 鉴权密钥，留空表示无鉴权；若填写需与后端 .env 的 ZLM_API_SECRET 一致
secret=
apiDebug=1

[hook]
; 是否开启 WebHook
enable=1
timeout_sec=10
; 流状态变化（上线/下线）回调 —— 用于更新设备在线状态
on_stream_changed=http://127.0.0.1:8000/api/zlm/hook/on_stream_changed
; MP4 录像完成（切段）回调 —— 用于写入录像索引
on_record_mp4=http://127.0.0.1:8000/api/zlm/hook/on_record_mp4
on_publish=
on_play=
on_stream_none_reader=
on_server_started=

[http]
; HTTP 服务端口（HTTP-FLV / HLS / REST API 共用）
port=8080
; 允许跨域（前端从 5173 拉流必需）
allow_cross_domains=1

[rtsp]
port=554

[rtmp]
port=1935

[general]
; 无人观看时自动停止流的延迟，0 表示不自动停止（家庭场景建议 0，保证录像/预览稳定）
streamNoneReaderDelayMS=0

[protocol]
enable_audio=1
enable_hls=1
enable_rtsp=1
enable_rtmp=1
enable_ts=1
enable_fmp4=1
; 全局 MP4 录像开关。这里设为 0，由后端按设备 record_enabled 通过 addStreamProxy 的
; enable_mp4 参数逐路控制；若你的 ZLMediaKit 版本较旧、逐路控制不生效，可改为 1 全局录像
enable_mp4=0
; 单个录像分片时长（秒），越小回调越频繁；建议 300（5 分钟）
mp4_max_second=300
; 录像保存路径（相对 ZLMediaKit 运行目录）
mp4_save_path=./www/record
hls_save_path=./www/hls
